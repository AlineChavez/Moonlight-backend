services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moonlight
      POSTGRES_USER: moonlight
      POSTGRES_PASSWORD: moonlight
    ports:
      - "5433:5432"
    volumes:
      - moonlight_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonlight -d moonlight"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://moonlight:moonlight@db:5432/moonlight
      JWT_SECRET: local-dev-only-secret-change-me-please-32chars-min
      ADMIN_EMAIL: admin@moonlight.local
      ADMIN_PASSWORD: admin1234
      ALLOWED_ORIGINS: "*"

volumes:
  moonlight_db_data:
